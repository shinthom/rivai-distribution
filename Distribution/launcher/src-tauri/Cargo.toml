[package]
name = "launcher"
version = "0.0.4"
description = "Rivai test launcher"
authors = ["Rivai"]
edition = "2021"

[lib]
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

# HTTP + streaming download
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"

# Cryptographic hash
sha2 = "0.10"
hex = "0.4"

# Async runtime extras (tauri brings tokio core; we enable features we need)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs", "process", "sync", "time"] }

# Errors
thiserror = "2"
